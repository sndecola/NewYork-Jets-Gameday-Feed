name: Update Jets Gameday RSS Feed

on:
  schedule:
    # Every 20 minutes, all day Sunday (UTC) — covers Sun/Mon/Thu games loosely.
    # Adjust as you like; cron is UTC.
    - cron: "*/20 * * * 0"
    # Also once a day at 13:00 UTC to catch schedule updates / bye weeks / next opponent.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        run: python scripts/generate_feed.py

      - name: Commit updated feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --cached --quiet || git commit -m "Update Jets gameday feed"
          git push
